[package]
name = "kacarong-desktop"
version = "1.3.0"
edition = "2021"
description = "kacarong 작업공간 PC 프로그램: https://kacarong.kr/admin 을 그대로 띄우는 창"
publish = false

[[bin]]
name = "kacarong"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
rfd = "0.18"
# 자동 업데이트: 서명(minisign)을 확인한 설치 파일만 실행한다. zip·tar 풀기는 안 쓴다.
serde_json = "1" # generate_context! 가 플러그인 설정(updater)을 넣을 때 쓴다
tokio = { version = "1", features = ["time"] } # tauri 의 실행기(이미 들어 있음)에 타이머만 켠다
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
