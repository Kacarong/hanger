[package]
name = "kacarong-desktop"
version = "1.0.2"
edition = "2021"
description = "kacarong 작업공간 PC 프로그램: https://kacarong.kr/admin 을 그대로 띄우는 창"
publish = false

[[bin]]
name = "kacarong"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
