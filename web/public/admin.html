<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kacarong 작업공간</title>
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<h1>kacarong 작업공간</h1>
<p id="msg" class="error"></p>

<div id="login" hidden>
  <form id="password-login">
    <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button>로그인</button>
  </form>
  <p id="google-login" hidden><a href="/auth/login">구글로 로그인</a></p>
</div>

<div id="main" hidden>
  <nav>
    <a href="#today">오늘</a> · <a href="#tasks">할 일·과제</a> · <a href="#files">파일함</a>
    · <a href="/" target="_blank">공개 페이지 보기</a> · <button id="logout">로그아웃</button>
  </nav>

<section id="tab-today" hidden>
  <h2 id="today-date"></h2>
  <div id="today-lists"></div>
</section>

<section id="tab-tasks" hidden>
  <form id="task-add">
    <fieldset>
      <legend>추가</legend>
      <p><select id="task-kind"></select>
         <input id="task-title" placeholder="제목" required size="30">
         <input id="task-course" placeholder="과목 (과제)"></p>
      <p><label>날짜 <input type="date" id="task-date"></label>
         <label>시간 <input type="time" id="task-time"></label></p>
      <p><input id="task-note" placeholder="메모" size="50"></p>
      <button>추가</button>
    </fieldset>
  </form>
  <p><select id="task-filter-done"><option value="0">안 끝난 것</option><option value="1">끝낸 것</option><option value="">전체</option></select>
     <select id="task-filter-kind"><option value="">전체 종류</option></select></p>
  <ul id="task-list" class="tasks"></ul>
</section>

<section id="tab-files" hidden>
  <p id="quota"></p>

  <form id="upload">
    <fieldset>
      <legend>업로드 (파일당 1GB 미만)</legend>
      <p><input type="file" id="files" multiple required></p>
      <p><label>분류 <select id="up-category"></select></label>
         <label>태그 <input id="up-tags" placeholder="쉼표로 구분"></label></p>
      <p><label>메모 <input id="up-note" size="50"></label></p>
      <button>올리기</button>
      <ul id="progress"></ul>
    </fieldset>
  </form>

  <form id="search">
    <input id="q" placeholder="이름, 태그, 메모 검색">
    <select id="filter-category"><option value="">전체 분류</option></select>
    <button>검색</button>
  </form>

  <table>
    <thead><tr><th></th><th>제목</th><th>분류 / 태그 / 메모</th><th>크기</th><th>공유</th><th>공개 페이지</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</section>
</div>
<script type="module" src="/static/admin.js"></script>
</body>
</html>
